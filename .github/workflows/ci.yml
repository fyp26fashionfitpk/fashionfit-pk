name: FashionFit-PK CI

on:
  push:
    branches: [ main, v4-hardening-and-reconciliation ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip numpy pillow fastapi httpx pydantic python-multipart
      - name: Run syntax checks and all Python unit/regression tests
        run: |
          python -m py_compile lib/*.py src/backend/main.py src/colab_server/v4_worker_core.py research/v4_controlled_experiments/fashn_segfree_runner.py
          python -m unittest discover -s tests -v

  frontend-and-js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Node request-ownership & Gemini-disabled tests
        run: node --test tests/test_studio_controller.mjs
      - name: Install frontend dependencies, run rendered React component tests, and build
        working-directory: src/frontend
        run: |
          npm ci
          npm test
          npm run build
